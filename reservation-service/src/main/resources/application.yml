server:
  port: ${RESERVATION_PORT:8082}

spring:
  application:
    name: reservation-service
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5442}/farelock
    username: reservation_svc
    password: ${RESERVATION_DB_PASSWORD}
    hikari:
      schema: reservation
      connection-timeout: 2000 # fail fast (ms) if the database is unreachable
  flyway:
    schemas: reservation,payment_provider
    default-schema: reservation

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets let Prometheus compute p50/p95/p99 across instances.
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

logging:
  structured:
    # JSON log lines (Elastic Common Schema) that include the requestId from the MDC.
    # Set LOG_FORMAT= (empty) for plain text while developing.
    format:
      console: ${LOG_FORMAT:ecs}
