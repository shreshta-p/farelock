server:
  port: ${PRICING_PORT:8081}

spring:
  application:
    name: pricing-service
  # Local dev convenience: read KEY=VALUE pairs from the repo-root .env file.
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5442}/farelock
    username: pricing_svc
    password: ${PRICING_DB_PASSWORD}
    hikari:
      schema: pricing
      connection-timeout: 2000 # fail fast (ms) if the database is unreachable
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    schemas: pricing
    default-schema: pricing
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6390}
      timeout: 100ms
      connect-timeout: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets let Prometheus compute p50/p95/p99 across instances.
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

logging:
  structured:
    # JSON log lines (Elastic Common Schema) that include the requestId from the MDC.
    # Set LOG_FORMAT= (empty) for plain text while developing.
    format:
      console: ${LOG_FORMAT:ecs}
