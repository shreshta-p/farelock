# Always run with an explicit env file:
#   docker compose --env-file .env up -d
name: farelock

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: farelock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PRICING_DB_PASSWORD: ${PRICING_DB_PASSWORD:?set in .env}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD:?set in .env}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farelock"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Optional monitoring: docker compose --env-file .env --profile monitoring up -d ---
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver # lets k6 push its own metrics too
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # read-only viewing without logging in (local only)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/farelock.json
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # --- k6 load tests: docker compose --env-file .env --profile loadtest run --rm k6 run /scripts/mixed.js ---
  k6:
    image: grafana/k6:1.2.3
    profiles: [loadtest]
    volumes:
      - ./load-tests:/scripts:ro
    environment:
      RESERVATION_URL: ${K6_RESERVATION_URL:-http://host.docker.internal:8082}
      PRICING_URL: ${K6_PRICING_URL:-http://host.docker.internal:8081}
      VUS: ${VUS:-}
      DURATION: ${DURATION:-}
      # With the monitoring profile running, add "-o experimental-prometheus-rw" to also see k6's own metrics.
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99)"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
